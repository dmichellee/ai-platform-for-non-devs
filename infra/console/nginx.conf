# AppHub 콘솔 nginx (D19 private 모드). non-root(8080).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # ALB 헬스체크
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # 런타임 설정 — 컨테이너 시작 시 env로 생성(40-apphub-config.sh). 캐시 금지.
    location = /config.json {
        alias /tmp/apphub/config.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    # Kiro 설정 zip(OS별 2개) — public 모드 CloudFront `/kiro-config/*`와 같은 경로.
    location /kiro-config/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # 해시 파일명 정적 자산은 장기 캐시.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SPA fallback — 클라이언트 라우팅 경로는 index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
