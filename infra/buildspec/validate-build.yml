# CodeBuild #1 — 검증 + 빌드 (DESIGN.md 3.3 [Build & Validate], KIRO-STANDARDS 3장)
#
# 계약(_workspace/contracts/buildspec-contract.md):
#  입력 소스: 사용자 앱 레포(루트에 Dockerfile 필수). CodePipeline Source 아티팩트.
#  검증기: @apphub/backend 의 Dockerfile 정적 검증기(dist/dockerfile-validator.mjs).
#          단위 테스트와 동일한 코드(src/validator/dockerfile.ts)를 실행한다.
#  이미지 태그: commit SHA(CODEBUILD_RESOLVED_SOURCE_VERSION). ECR push.
#  실패 분류(failureCategory)는 검증기 JSON(failureCategory) 또는 단계별로 결정하고 DDB에 기록.
#  단계: 1) Dockerfile 정적 검증(C1/C2/C6/금지항목) 2) docker build(BUILD_FAILED)
#        3) 스모크 /health 200(C3+C9, HEALTHCHECK_FAILED) 4) ECR push(태그=commitSha)
#  출력(exported-variables): IMAGE_TAG — 다음 스테이지(Deploy)가 소비.
#
# 환경변수(프로젝트에서 주입): STAGE, APP_ID, AWS_ACCOUNT_ID, AWS_DEFAULT_REGION,
#                              ECR_REPO_NAME, TABLE_NAME, AUTO_DEPLOY
version: 0.2

env:
  exported-variables:
    - IMAGE_TAG
    - FAILURE_CATEGORY

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - node --version
      # 검증기는 플랫폼이 소유한 코드다. 플랫폼 배포 자산(S3)에서 받거나, 여기서는
      #  npm 레지스트리 대신 플랫폼이 제공한 검증기 번들을 사용한다.
      #  실제 배포에서는 provisioner가 검증기 번들 위치를 VALIDATOR_URL 로 주입한다.
      #  (계약: 없으면 소스에 동봉된 표준 검증기를 쓸 수 없으므로 플랫폼 제공이 원칙)
      - |
        if [ -n "${VALIDATOR_S3_URI:-}" ]; then
          aws s3 cp "${VALIDATOR_S3_URI}" ./dockerfile-validator.mjs
        else
          echo "VALIDATOR_S3_URI 미지정 — 플랫폼 제공 검증기 번들이 필요합니다." >&2
          echo "provisioner가 platform 배포 시 업로드한 검증기 위치를 주입해야 합니다." >&2
          exit 1
        fi

  pre_build:
    commands:
      - export IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:-latest}"
      - echo "이미지 태그(commit SHA)=${IMAGE_TAG}"
      # 관리자 허용 베이스 이미지 목록을 AdminSettings(DDB CONFIG/SETTINGS)에서 읽어 검증기에 전달.
      - |
        ALLOWED_JSON="$(aws dynamodb get-item \
          --table-name "${TABLE_NAME}" \
          --key '{"PK":{"S":"CONFIG"},"SK":{"S":"SETTINGS"}}' \
          --query 'Item.allowedBaseImages.L[*].S' --output json 2>/dev/null || echo '[]')"
        echo "${ALLOWED_JSON}" > /tmp/allowed-base-images.json
        echo "허용 베이스 이미지: ${ALLOWED_JSON}"

  build:
    commands:
      # (1) Dockerfile 정적 검증 — 검증기 종료코드가 실패면 파이프라인 중단.
      #     검증기 JSON을 파싱해 실패 시 FAILURE_CATEGORY 를 export(배포 이력 기록용).
      - |
        set +e
        VALIDATE_JSON="$(node ./dockerfile-validator.mjs ./Dockerfile \
          --allowed-base-images-json /tmp/allowed-base-images.json)"
        VALIDATE_RC=$?
        set -e
        echo "검증 결과: ${VALIDATE_JSON}"
        if [ "${VALIDATE_RC}" != "0" ]; then
          export FAILURE_CATEGORY="$(echo "${VALIDATE_JSON}" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).failureCategory')"
          echo "Dockerfile 검증 실패: ${FAILURE_CATEGORY}" >&2
          exit 1
        fi
      # (2) docker build — 실패 시 BUILD_FAILED.
      - |
        set +e
        docker build -t "app-local:${IMAGE_TAG}" .
        BUILD_RC=$?
        set -e
        if [ "${BUILD_RC}" != "0" ]; then
          export FAILURE_CATEGORY="BUILD_FAILED"
          echo "docker build 실패" >&2
          exit 1
        fi
      # (3) 스모크 /health — 이미지 실행 후 60초 내 GET /health 200(C3+C9).
      #     실패 시 HEALTHCHECK_FAILED (배포 전에 잡음).
      - |
        set +e
        docker run -d --name smoke -p 8080:8080 -e PORT=8080 "app-local:${IMAGE_TAG}"
        OK="false"
        for i in $(seq 1 30); do
          CODE="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health || echo 000)"
          if [ "${CODE}" = "200" ]; then OK="true"; break; fi
          sleep 2
        done
        docker logs smoke || true
        docker rm -f smoke || true
        set -e
        if [ "${OK}" != "true" ]; then
          export FAILURE_CATEGORY="HEALTHCHECK_FAILED"
          echo "스모크 /health 200 실패(60초 내 무응답)" >&2
          exit 1
        fi
      # (4) ECR push (태그=commitSha) + latest.
      - |
        aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" \
          | docker login --username AWS --password-stdin \
            "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
        ECR_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO_NAME}"
        docker tag "app-local:${IMAGE_TAG}" "${ECR_URI}:${IMAGE_TAG}"
        docker push "${ECR_URI}:${IMAGE_TAG}"

  post_build:
    commands:
      # 다음 스테이지(Deploy)로 넘길 이미지 태그를 아티팩트 파일로도 남긴다(imagedefinitions 대체).
      - echo "{\"imageTag\":\"${IMAGE_TAG}\"}" > image-tag.json
      - cat image-tag.json

artifacts:
  files:
    - image-tag.json
