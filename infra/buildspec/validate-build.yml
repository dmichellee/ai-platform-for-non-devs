# CodeBuild #1 — 검증 + 빌드 (DESIGN.md 3.3 [Build & Validate], KIRO-STANDARDS 3장)
#
# 계약(_workspace/contracts/buildspec-contract.md):
#  입력 소스: 사용자 앱 레포(루트에 Dockerfile 필수). CodePipeline Source 아티팩트.
#  검증기: apphub-backend 의 Dockerfile 정적 검증기(Python, dist/validator/ 2파일:
#          dockerfile_validator.py + dockerfile.py). 단위 테스트와 동일한 코드(app/validator/dockerfile.py)를 실행한다.
#  이미지 태그: commit SHA(CODEBUILD_RESOLVED_SOURCE_VERSION). ECR push.
#  실패 분류(failureCategory)는 검증기 JSON(failureCategory) 또는 단계별로 결정하고 DDB에 기록.
#  단계: 1) Dockerfile 정적 검증(C1 존재/C2 EXPOSE 8080/금지항목) 2) docker build(BUILD_FAILED)
#        3) 스모크 /health 200(C3+C9, HEALTHCHECK_FAILED) 4) ECR push(태그=commitSha)
#  출력(exported-variables): IMAGE_TAG — 다음 스테이지(Deploy)가 소비.
#
# 환경변수(프로젝트에서 주입): STAGE, APP_ID, AWS_ACCOUNT_ID, AWS_DEFAULT_REGION,
#                              ECR_REPO_NAME, AUTO_DEPLOY
#  TABLE_NAME 도 주입되지만 이 buildspec 은 사용하지 않는다(베이스 이미지 허용목록 조회 제거 후 잔존).
#  VALIDATOR_S3_URI — Python 검증기 자산 위치. 디렉토리 prefix(s3://.../validator/)를 가리키며
#                     2파일(dockerfile_validator.py, dockerfile.py)을 재귀 복사한다(D-M8).
version: 0.2

env:
  exported-variables:
    - IMAGE_TAG
    - FAILURE_CATEGORY

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - python3 --version
      # 검증기는 플랫폼이 소유한 코드다(신뢰 경계). 플랫폼 배포 자산(S3)에서 받는다.
      #  D-M8: 검증기는 Python 자립 스크립트 2파일(dockerfile_validator.py + dockerfile.py).
      #  VALIDATOR_S3_URI 는 디렉토리 prefix(끝에 `/`, 예: s3://.../validator/)다. 두 파일을
      #  **명시적으로** cp 한다(--recursive 는 s3:ListBucket 을 요구하나 app-pipeline IAM 은
      #  GetObject 만 부여 → 명시 cp 로 ListBucket 없이 받는다).
      #  실제 배포에서는 provisioner→app-pipeline 이 이 위치를 VALIDATOR_S3_URI 로 주입한다.
      - |
        if [ -n "${VALIDATOR_S3_URI:-}" ]; then
          mkdir -p ./validator
          VAL_PREFIX="${VALIDATOR_S3_URI%/}"
          aws s3 cp "${VAL_PREFIX}/dockerfile_validator.py" ./validator/dockerfile_validator.py
          aws s3 cp "${VAL_PREFIX}/dockerfile.py" ./validator/dockerfile.py
          if [ ! -f ./validator/dockerfile_validator.py ] || [ ! -f ./validator/dockerfile.py ]; then
            echo "검증기 자산이 불완전합니다(dockerfile_validator.py + dockerfile.py 필요)." >&2
            exit 1
          fi
        else
          echo "VALIDATOR_S3_URI 미지정 — 플랫폼 제공 검증기 자산이 필요합니다." >&2
          echo "provisioner가 platform 배포 시 업로드한 검증기 위치를 주입해야 합니다." >&2
          exit 1
        fi

  pre_build:
    commands:
      - export IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:-latest}"
      - echo "이미지 태그(commit SHA)=${IMAGE_TAG}"

  build:
    commands:
      # (1) Dockerfile 정적 검증 — 검증기 종료코드가 실패면 파이프라인 중단.
      #     검증기 JSON을 파싱해 실패 시 FAILURE_CATEGORY 를 export(배포 이력 기록용).
      #     D-M8: Python 검증기. Dockerfile 경로만 넘긴다(베이스 이미지 허용목록 기능 제거).
      #     검사: C1 존재 / C2 EXPOSE 8080 / 금지항목 / non-root(경고). stdout JSON 한 줄, exit 0/1, failureCategory.
      - |
        set +e
        VALIDATE_JSON="$(python3 ./validator/dockerfile_validator.py ./Dockerfile)"
        VALIDATE_RC=$?
        set -e
        echo "검증 결과: ${VALIDATE_JSON}"
        if [ "${VALIDATE_RC}" != "0" ]; then
          export FAILURE_CATEGORY="$(echo "${VALIDATE_JSON}" | python3 -c 'import sys,json; print(json.load(sys.stdin)["failureCategory"])')"
          echo "${FAILURE_CATEGORY}" > "${CODEBUILD_SRC_DIR}/.apphub-failure-category"
          echo "Dockerfile 검증 실패: ${FAILURE_CATEGORY}" >&2
          exit 1
        fi
      # (2) docker build — 실패 시 BUILD_FAILED.
      - |
        set +e
        docker build -t "app-local:${IMAGE_TAG}" .
        BUILD_RC=$?
        set -e
        if [ "${BUILD_RC}" != "0" ]; then
          export FAILURE_CATEGORY="BUILD_FAILED"
          echo "${FAILURE_CATEGORY}" > "${CODEBUILD_SRC_DIR}/.apphub-failure-category"
          echo "docker build 실패" >&2
          exit 1
        fi
      # (3) 스모크 /health — 이미지 실행 후 60초 내 GET /health 200(C3+C9).
      #     실패 시 HEALTHCHECK_FAILED (배포 전에 잡음).
      - |
        set +e
        docker run -d --name smoke -p 8080:8080 -e PORT=8080 "app-local:${IMAGE_TAG}"
        OK="false"
        for i in $(seq 1 30); do
          CODE="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health || echo 000)"
          if [ "${CODE}" = "200" ]; then OK="true"; break; fi
          sleep 2
        done
        docker logs smoke || true
        docker rm -f smoke || true
        set -e
        if [ "${OK}" != "true" ]; then
          export FAILURE_CATEGORY="HEALTHCHECK_FAILED"
          echo "${FAILURE_CATEGORY}" > "${CODEBUILD_SRC_DIR}/.apphub-failure-category"
          echo "스모크 /health 200 실패(60초 내 무응답)" >&2
          exit 1
        fi
      # (4) ECR push (태그=commitSha). latest 태그는 쓰지 않는다 — 롤백은 SHA 태그로 특정한다.
      - |
        aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" \
          | docker login --username AWS --password-stdin \
            "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
        ECR_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO_NAME}"
        docker tag "app-local:${IMAGE_TAG}" "${ECR_URI}:${IMAGE_TAG}"
        docker push "${ECR_URI}:${IMAGE_TAG}"

  post_build:
    commands:
      # 실패 분류 복원: build 단계의 `exit 1`은 셸을 종료시켜 export 한 FAILURE_CATEGORY 가 사라진다.
      #  (CodeBuild 는 post_build 를 새 셸에서 실행하고, exported-variables 는 post_build 종료 시점 값을 내보낸다.)
      #  그래서 실패 지점에서 파일로 남기고 여기서 다시 export 한다 — deploy-notify 가 이 값으로 분류한다.
      - export FAILURE_CATEGORY="$(cat "${CODEBUILD_SRC_DIR}/.apphub-failure-category" 2>/dev/null || true)"
      # 다음 스테이지(Deploy)로 넘길 이미지 태그를 아티팩트 파일로도 남긴다(imagedefinitions 대체).
      - echo "{\"imageTag\":\"${IMAGE_TAG}\"}" > image-tag.json
      - cat image-tag.json

artifacts:
  files:
    - image-tag.json
