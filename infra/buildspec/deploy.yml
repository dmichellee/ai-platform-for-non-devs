# CodeBuild #2 — 배포(cdk deploy app-runtime) (DESIGN.md 3.3 [Deploy], 3.5 드리프트 방지)
#
# 계약(_workspace/contracts/buildspec-contract.md):
#  입력 아티팩트: ValidateBuild 산출물 image-tag.json({"imageTag":"<commitSha>"}).
#  동작: 앱 파라미터(preset/scheme/subdomain/priority/permissionTemplate/이미지태그)를
#        컨텍스트로 cdk deploy `apphub-{stage}-app-{appId}-runtime` 실행.
#  앱 파라미터 출처: DDB App 레코드(APP#{appId}/META) + ComputePreset/PermissionTemplate.
#        (여기서 조회해 컨텍스트로 조립 → app 스택 모드 synth/deploy)
#  드리프트 방지(DESIGN 3.5): isInitialDeploy는 스택 존재 여부로 판정(최초=true → desiredCount 지정,
#        갱신=false → 미지정 = 현재 desiredCount 유지).
#  잠자는 앱(runtimeState=SLEEPING) 배포(QA H2·N2, 2026-10-08): 깨우지 않는다(desiredCount 0 유지). cdk deploy
#        직전에 리스너 규칙 forward 만 앱 TG 로 되돌리고(ECS 갱신이 LB 미연결 TG 를 거부하므로 — N2,
#        authenticate-cognito 유지), 배포가 끝나면(성공·실패) deploy-notify 가 sleep_app 으로 forward→Waker TG 를
#        멱등 재적용한다. 공용 헬퍼 helpers/prepare-sleeping-app.cjs. 근거·대안 비교는 buildspec-contract.md §8.
#  컨텍스트 조립: 공용 헬퍼 helpers/runtime-ctx.cjs(provisioner.yml runtime 과 같은 코드). 프리셋/권한 템플릿이
#        없으면 실패(QA M3 이중 안전장치).
#  deployId(D8, QA D-1): -c deployId=${CODEBUILD_BUILD_ID} → 태스크 정의 dockerLabels apphub.deployId(매 배포 새 리비전).
#  실패 시: FAILURE_CATEGORY=DEPLOY_FAILED — 실패 지점에서 파일로 남기고 post_build 에서 재export
#        (CloudFormation 자동 롤백 → 이전 버전 유지).
#
# 환경변수(프로젝트 주입): STAGE, APP_ID, AWS_ACCOUNT_ID, AWS_DEFAULT_REGION, CDK_SOURCE_S3_URI
#  공용 헬퍼(cdk-src/infra/buildspec/helpers/*.cjs)는 CDK 소스 tarball(scripts/deploy.sh 3b, infra 포함)에 들어 있다.
version: 0.2

env:
  exported-variables:
    - FAILURE_CATEGORY

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - node --version
      - npm i -g aws-cdk pnpm
      # 플랫폼 CDK 코드 확보(app-runtime construct 포함). provisioner가 CDK_SOURCE_S3_URI 주입.
      - |
        if [ -n "${CDK_SOURCE_S3_URI:-}" ]; then
          aws s3 cp "${CDK_SOURCE_S3_URI}" ./cdk-src.tgz
          mkdir -p cdk-src && tar -xzf cdk-src.tgz -C cdk-src
          cd cdk-src && pnpm install --frozen-lockfile && cd -
        else
          echo "CDK_SOURCE_S3_URI 미지정 — 앱 런타임 스택 배포에 플랫폼 CDK 코드가 필요합니다." >&2
          exit 1
        fi

  pre_build:
    commands:
      - export TABLE_NAME="apphub-${STAGE}-main"
      - export RUNTIME_STACK="apphub-${STAGE}-app-${APP_ID}-runtime"
      - export IMAGE_TAG="$(node -pe 'JSON.parse(require("fs").readFileSync("image-tag.json","utf8")).imageTag' 2>/dev/null || echo latest)"
      - echo "배포 대상 스택=${RUNTIME_STACK}, 이미지 태그=${IMAGE_TAG}"
      # 최초 배포 여부: CloudFormation 스택 존재 확인(존재하면 갱신=false).
      - |
        if aws cloudformation describe-stacks --stack-name "${RUNTIME_STACK}" \
             --region "${AWS_DEFAULT_REGION}" >/dev/null 2>&1; then
          export IS_INITIAL="false"
        else
          export IS_INITIAL="true"
        fi
      - echo "최초 배포 여부(IS_INITIAL)=${IS_INITIAL}"

  build:
    commands:
      # 아래 3단계는 실패 가능하므로 build 단계에 둔다 — build 실패는 post_build 로 이어져 FAILURE_CATEGORY 를
      #  복원할 수 있다(pre_build 실패는 post_build 를 거치지 않는다).
      #  실패 시 `exit 1` 이 셸을 끝내 export 값이 사라지므로 **반드시 파일로 남긴다**(validate-build.yml 과 같은 패턴).
      # (1) 앱 레코드 + 프리셋/권한 템플릿 조회 → 컨텍스트 조립(공용 헬퍼, provisioner.yml runtime 과 동일 코드).
      #  DDB AttributeValue 재귀 언마샬 → app-params.ts loader 키(schedule/envVars/secretArn/secretKeysB64/
      #  permissionPolicyB64/albIndex)로 emit(QA F-1/F-2/M-4).
      #  이중 안전장치(QA M3): 프리셋/권한 템플릿 아이템이 없으면 cpu=0·권한 소실로 진행하지 않고 실패.
      - |
        set +e
        node cdk-src/infra/buildspec/helpers/runtime-ctx.cjs > /tmp/app-ctx.env
        CTX_RC=$?
        set -e
        if [ "${CTX_RC}" != "0" ]; then
          echo "DEPLOY_FAILED" > "${CODEBUILD_SRC_DIR}/.apphub-failure-category"
          echo "배포 컨텍스트 조립 실패(위 [apphub] 메시지 참고) — 배포하지 않습니다." >&2
          exit 1
        fi
      # 컨텍스트 파일 전체를 echo 하지 않는다(QA F5) — 빌드 로그는 앱 소유자에게 보인다(M6).
      #  *B64(permissionPolicyB64=권한 템플릿 정책 문서, envVarsB64, secretKeysB64, scheduleB64)는 길이만.
      - |
        awk '{ line=$0; sub(/^export /, "", line); k=line; sub(/=.*/, "", k); v=substr(line, length(k)+2); if (k ~ /B64$/) print k "=<" length(v) " chars>"; else print k "=" v }' /tmp/app-ctx.env
      - . /tmp/app-ctx.env
      # (2) 잠든 앱 배포 전 규칙 복귀(QA N2): runtime 스택이 있고 runtimeState=SLEEPING 이면 리스너 규칙의
      #  forward 만 앱 TG 로 되돌린다(authenticate-cognito 유지, desiredCount 0 유지). 배포 후(성공·실패)
      #  재수면은 deploy-notify 가 한다. AWS 호출 실패면 중단(근거: buildspec-contract §8).
      - |
        set +e
        node cdk-src/infra/buildspec/helpers/prepare-sleeping-app.cjs
        PREP_RC=$?
        set -e
        if [ "${PREP_RC}" != "0" ]; then
          echo "DEPLOY_FAILED" > "${CODEBUILD_SRC_DIR}/.apphub-failure-category"
          echo "잠든 앱 배포 준비 실패 — 배포하지 않습니다(앱은 잠든 상태 유지)." >&2
          exit 1
        fi
      # (3) cdk deploy. deployId(D8/D-1): 매 배포 고유값(빌드 ID)을 태스크 정의 docker 라벨 apphub.deployId 로
      #  넣어 항상 새 리비전 → 태스크 교체(값만 바뀐 시크릿도 반영).
      - |
        set +e
        cd cdk-src/infra
        cdk deploy "${RUNTIME_STACK}" --require-approval never --region "${AWS_DEFAULT_REGION}" \
          -c stage="${STAGE}" \
          -c appId="${CTX_appId}" \
          -c appStackKind=runtime \
          -c subdomain="${CTX_subdomain}" \
          -c scheme="${CTX_scheme}" \
          -c albIndex="${CTX_albIndex}" \
          -c imageTag="${CTX_imageTag}" \
          -c deployId="${CODEBUILD_BUILD_ID}" \
          -c rulePriority="${CTX_rulePriority}" \
          -c cpu="${CTX_cpu}" -c memory="${CTX_memory}" \
          -c minCount="${CTX_minCount}" -c maxCount="${CTX_maxCount}" \
          -c scaleMetric="${CTX_scaleMetric}" -c scaleThreshold="${CTX_scaleThreshold}" \
          -c sleepMode="${CTX_sleepMode}" \
          -c cognitoProtect="${CTX_cognitoProtect}" \
          -c isInitialDeploy="${CTX_isInitialDeploy}" \
          ${CTX_scheduleB64:+-c schedule="${CTX_scheduleB64}"} \
          ${CTX_envVarsB64:+-c envVars="${CTX_envVarsB64}"} \
          ${CTX_secretArn:+-c secretArn="${CTX_secretArn}"} \
          ${CTX_secretKeysB64:+-c secretKeysB64="${CTX_secretKeysB64}"} \
          ${CTX_permissionPolicyB64:+-c permissionPolicyB64="${CTX_permissionPolicyB64}"}
        DEPLOY_RC=$?
        set -e
        if [ "${DEPLOY_RC}" != "0" ]; then
          echo "DEPLOY_FAILED" > "${CODEBUILD_SRC_DIR}/.apphub-failure-category"
          echo "cdk deploy 실패 — CloudFormation 롤백으로 이전 버전 유지" >&2
          exit 1
        fi

  post_build:
    commands:
      # 실패 분류 복원: build 단계의 `exit 1`은 셸을 종료시켜 export 값이 사라진다 → 파일에서 다시 export.
      #  (CodeBuild 는 post_build 를 새 셸에서 실행하고, exported-variables 는 post_build 종료 시점 값을 내보낸다.)
      - export FAILURE_CATEGORY="$(cat "${CODEBUILD_SRC_DIR}/.apphub-failure-category" 2>/dev/null || true)"
      # 주의: 따옴표 안이라도 `: ` 가 있으면 YAML 매핑으로 파싱돼 CodeBuild YAML_FILE_ERROR → 작은따옴표로 감싼다.
      - 'echo "app-runtime 배포 종료 - ${RUNTIME_STACK} (이미지 ${IMAGE_TAG}, 실패분류 ${FAILURE_CATEGORY:-없음})"'
